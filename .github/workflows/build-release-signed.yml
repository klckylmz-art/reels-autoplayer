name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-release-signed.yml'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        run: gradle assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -storepass reelsautoplayer2026 \
            -keypass reelsautoplayer2026 \
            -alias reels-autoplayer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Reels AutoPlayer, OU=Mobile, O=Yilmaz, L=Istanbul, ST=Istanbul, C=TR"

      - name: Locate Android build tools
        id: buildtools
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "path=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "Using $BUILD_TOOLS"

      - name: Zipalign release APK
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' -o -name 'app-release.apk' | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "Release APK not found"
            find app/build/outputs -maxdepth 5 -type f -print
            exit 1
          fi
          "${{ steps.buildtools.outputs.path }}/zipalign" -f -p 4 "$UNSIGNED" app-release-aligned.apk

      - name: Sign release APK
        run: |
          "${{ steps.buildtools.outputs.path }}/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias reels-autoplayer \
            --ks-pass pass:reelsautoplayer2026 \
            --key-pass pass:reelsautoplayer2026 \
            --out Instagram-Reels-AutoPlayer-Release.apk \
            app-release-aligned.apk

      - name: Verify APK signature
        run: |
          "${{ steps.buildtools.outputs.path }}/apksigner" verify --verbose --print-certs Instagram-Reels-AutoPlayer-Release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Reels-AutoPlayer-Signed-Release
          path: Instagram-Reels-AutoPlayer-Release.apk
          if-no-files-found: error
