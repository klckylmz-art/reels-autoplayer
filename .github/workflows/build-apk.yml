name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "codex/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Test, lint, and build
        run: gradle testDebugUnitTest compileDebugAndroidTestKotlin lintDebug assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReelsPlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsPlayer-APK
          path: ReelsPlayer.apk
          if-no-files-found: error
